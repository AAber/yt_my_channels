name: yt_my_channels
description: A Flutter app for viewing my favorite YotTube channels
publish_to: 'none'
version: 0.0.4+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0
  
  # Media Playback
  video_player: ^2.9.0
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  just_audio_background: ^0.0.1-beta.11
#  youtube_player_iframe: ^5.1.2
  
  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Torah AI Assistant package
  torah_ai_assistant:
    path: ./torah_ai_assistant

  # Utilities
  url_launcher: ^6.2.1
  open_file: ^3.5.11
  package_info_plus: ^8.1.0
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.3
  youtube_player_flutter: ^9.1.3
  dio: ^5.4.0
  path_provider: ^2.1.2
  app_links: ^6.4.0
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10
  yaml: ^3.1.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/sia_splash.png
    - assets/my-icon.png
    - assets/icon/sia.png
    - assets/icon/taylor.png
    - assets/icon/ed.png
    - assets/icon/adele.png
    - assets/icon/ariana.png
    - assets/icon/beyonce.png
    - assets/icon/drake.png
    - assets/icon/billie.png
    - assets/icon/weeknd.png
    - assets/icon/meir.png
    - assets/icon/tfc.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icon/app_icon.png"
  image_path_ios: "assets/my-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#000000"
  image: assets/sia_splash.png
  android_12:
    color: "#000000"
    image: assets/sia_splash.png
