map $http_user_agent $is_bot {
    default                     0;
    "~*whatsapp"                1;
    "~*facebookexternalhit"     1;
    "~*twitterbot"              1;
    "~*linkedinbot"             1;
    "~*slackbot"                1;
    "~*telegrambot"             1;
    "~*discordbot"              1;
    "~*applebot"                1;
    "~*googlebot"               1;
    "~*bingbot"                 1;
}

# NOTE: checked only after $is_bot excludes crawlers, since Googlebot's
# smartphone UA string itself contains "iPhone".
map $http_user_agent $is_ios {
    default        0;
    "~*iPhone"      1;
    "~*iPad"        1;
    "~*iPod"        1;
}

map $http_user_agent $is_android {
    default        0;
    "~*Android"     1;
}

# Plain HTTP: required for Certbot renewal, and redirects real users to HTTPS.
server {
    listen 80;
    server_name myyt.isaac770.live;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl; # managed by Certbot
    server_name myyt.isaac770.live;
    root /var/www/html;
    index myyt.html index.htm;
    default_type "text/html; charset=UTF-8";

    location / {
        # NOTE: Open Graph data must live in <meta property="og:..."> tags
        # inside myyt.html's <head> — WhatsApp, Facebook, Slack, etc. parse
        # the HTML body, not custom response headers. Make sure myyt.html
        # contains something like:
        #   <meta property="og:title" content="My YT Channels">
        #   <meta property="og:type" content="website">
        #   <meta property="og:url" content="https://myyt.isaac770.live/">
        #   <meta property="og:image" content="https://www.isaac770.live/media/myyt-og.png">
        #   <meta property="og:description" content="יחי אדוננו מורנו ורבנו מלך המשיח לעולם ועד">
        #
        # These custom headers are kept only as a debugging aid (so `curl -I`
        # shows something readable) — they are NOT valid HTTP header names
        # (a colon can't appear in a header name) and bots will ignore them.
        # `always` ensures they still appear even on non-2xx responses,
        # which is what makes 404s visible/debuggable instead of silently
        # dropping the headers.
        add_header X-OG-Title "My YT Channels" always;
        add_header X-OG-Type "website" always;
        add_header X-OG-Url "https://myyt.isaac770.live/" always;
        add_header X-OG-Image "https://www.isaac770.live/media/myyt-og.png" always;
        add_header X-OG-Description "יחי אדוננו מורנו ורבנו מלך המשיח לעולם ועד" always;

        # Bots: skip the redirect logic below and fall through to try_files,
        # so they see myyt.html with the OG meta tags (no JS is executed).
        if ($is_bot) {
            break;
        }

        # Real iOS users -> App Store
        if ($is_ios) {
            return 302 https://apps.apple.com/us/app/my-yt-channels/id6800364851;
        }

        # Real Android users -> Play Store
        if ($is_android) {
            return 302 https://play.google.com/store/apps/details?id=live.isaac770.My_YT_Channels;
        }

        # Everyone else (desktop, unknown UA, bots that fell through above):
        # serve myyt.html; any remaining client-side JS logic in it still runs.
        try_files $uri $uri/ /myyt.html;
    }

    location /.well-known/apple-app-site-association {
        alias /var/www/html/.well-known/apple-app-site-association;
        add_header Content-Type application/json;
    }
    location /.well-known/assetlinks.json {
        alias /var/www/html/.well-known/assetlinks.json;
        add_header Content-Type application/json;
    }

    ssl_certificate /etc/letsencrypt/live/myyt.isaac770.live-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/myyt.isaac770.live-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
