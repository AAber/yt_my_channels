server {
    server_name myyt.isaac770.live;

    root /var/www/html;
    index myyt.html index.htm;

    location / {
        add_header Content-Type text/html;

        # Open Graph meta tags
        add_header og:title "My YT Channels";
        add_header og:type "website";
        add_header og:url "https://myyt.isaac770.live/";
        add_header og:image "https://www.isaac770.live/media/myyt-og.png";
        add_header og:description "יחי אדוננו מורנו ורבנו מלך המשיח לעולם ועד";

        # Social media crawlers: serve OG tags without JS redirect
        if ($http_user_agent ~* "(whatsapp|facebookexternalhit|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|applebot|googlebot|bingbot)") {
            return 200;
        }

        try_files $uri $uri/ /myyt.html;
    }

    location /.well-known/apple-app-site-association {
        alias /var/www/html/.well-known/apple-app-site-association;
        add_header Content-Type application/json;
    }

    location /.well-known/assetlinks.json {
        alias /var/www/html/.well-known/assetlinks.json;
        add_header Content-Type application/json;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/myyt.isaac770.live-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/myyt.isaac770.live-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}

